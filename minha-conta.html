<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<link rel="stylesheet" href="assets/css/style.css">
<script src="script.js" defer></script>

<title>Minha Conta</title>


</head>

<body>

<section>
    <h2>Tema da página</h2>

    <button class="botao-tema" onclick="mudarTema()">
        Mudar tema
    </button>
</section>


<section class="cadastro">

    <h2>Cadastro do participante</h2>

    <form id="formulario">

        <label for="nome">Nome completo:</label>

        <input
            type="text"
            id="nome"
            placeholder="Digite seu nome"
        >

        <p id="mensagemNome"></p>


        <label for="email">E-mail:</label>

        <input
            type="email"
            id="email"
            placeholder="Ex: joao@gmail.com"
        >

        <p id="mensagemEmail"></p>


        <label for="idade">Idade:</label>

        <input
            type="number"
            id="idade"
            placeholder="Digite sua idade"
        >


        <label for="cidade">Cidade:</label>

        <input
            type="text"
            id="cidade"
            placeholder="Digite sua cidade"
        >


        <label for="senha">Senha:</label>

        <div class="campo-senha">

            <input
                type="password"
                id="senha"
                placeholder="Ex: 12!@43Hg"
            >

            <button
                type="button"
                onclick="mostrarSenha()"
            >
                👁️
            </button>

        </div>


        <section>
            <button onclick="salvarAlteracao()">
                Salvar Dados
            </button>

            <p id="aviso">
                Dados salvos com sucesso! ✓✓✓
            </p>
        </section>
    </form>

</section>


<section class="perfil">

    <h2>Meu perfil</h2>

    <div id="dadosPerfil">

        <p>
            Nome:
            <span id="perfilNome"></span>
        </p>

        <p>
            E-mail:
            <span id="perfilEmail"></span>
        </p>

        <p>
            Idade:
            <span id="perfilIdade"></span>
        </p>

        <p>
            Cidade:
            <span id="perfilCidade"></span>
        </p>

    </div>


    <div class="imagem-perfil">

        <h3>Imagem de perfil</h3>

        <img
            id="imagemPrincipal"
            src="assets/img/Nathan.png"
            alt="Imagem de perfil"
        >

        <div class="miniaturas">

            <img
                src="assets/img/Leticia.png"
                alt="Perfil 1"
                class="miniatura"
                onclick="trocarImagem('assets/img/Leticia.png')"
            >

            <img
                src="assets/img/Milena.png"
                alt="Perfil 2"
                class="miniatura"
                onclick="trocarImagem('assets/img/Milena.png')"
            >

            <img
                src="assets/img/Kenedy.png"
                alt="Perfil 3"
                class="miniatura"
                onclick="trocarImagem('assets/img/Kenedy.png')"
            >

            <img
                src="assets/img/Nathan.png"
                alt="Perfil 3"
                class="miniatura"
                onclick="trocarImagem('assets/img/Nathan.png')"
            >

        </div>

    </div>

</section>


</body>

</html>
